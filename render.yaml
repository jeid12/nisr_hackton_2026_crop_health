# Render blueprint: the whole platform on Render, both services built from Docker.
#   1. crophealth-api        FastAPI backend          (Dockerfile at the repo root)
#   2. crophealth-dashboard  Next.js static site on nginx (frontend/Dockerfile)
# Deploy: Render dashboard -> New -> Blueprint -> select this repository.
services:
  - type: web
    name: crophealth-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      # Sample dashboard credentials, also listed in README.md so evaluators can sign in.
      - key: CROPHEALTH_USER
        value: admin
      - key: CROPHEALTH_PASSWORD
        value: crophealth2026
      # Token signing key, generated by Render. Keeps sessions valid across restarts.
      - key: CROPHEALTH_SECRET
        generateValue: true

  - type: web
    name: crophealth-dashboard
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /login
    envVars:
      # Public URL of the API service, for example https://crophealth-api.onrender.com.
      # Read at container start, so changing it does not require a rebuild.
      - key: API_BASE
        sync: false
