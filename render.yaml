# Render blueprint: the whole platform on Render (free plan).
#   1. crophealth-api        FastAPI backend, built from Dockerfile
#   2. crophealth-dashboard  Next.js dashboard exported as a static site
# Deploy: Render dashboard -> New -> Blueprint -> select this repository.
services:
  - type: web
    name: crophealth-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      # Sample dashboard credentials, also listed in README.md so evaluators can sign in.
      - key: CROPHEALTH_USER
        value: admin
      - key: CROPHEALTH_PASSWORD
        value: crophealth2026
      # Token signing key, generated by Render. Keeps sessions valid across restarts.
      - key: CROPHEALTH_SECRET
        generateValue: true

  - type: web
    name: crophealth-dashboard
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./out
    envVars:
      # Public URL of the API service, for example https://crophealth-api.onrender.com
      # Set this in the Render dashboard after the API is live. It is baked into the build.
      - key: NEXT_PUBLIC_API_BASE
        sync: false
    routes:
      # Clean URL for the sign-in page, then single-page fallback for everything else
      - type: rewrite
        source: /login
        destination: /login.html
      - type: rewrite
        source: /*
        destination: /index.html
